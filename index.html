<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>English verbs</title>
</head>

<body>
  <header>
    <h1>English Verbs</h1>
  </header>

  <main>
    <div class="controls-section">
      <input type="search" id="search-input" placeholder="Search verbs...">
      <select id="type-filter">
        <option value="all">All Types</option>
        <option value="R">Regular</option>
        <option value="I">Irregular</option>
      </select>
      <button id="show-all-btn">Show All Verbs</button>
      <button id="show-random-btn">Show 10 Random Verbs</button>
    </div>
    <hr>
    <main id="verb-cards-container"></main>
    <div class="notificacion-verbs flex-row-center">
      <p></p>
    </div>
  </main>

  <template id="dataTemplate">
    <div class="verb-card">
      <h3 class="verb-simple-form"></h3>
      <p>Type: <span class="verb-type"></span></p>
      <p>Third Person: <span class="verb-third-person"></span></p>
      <p>Simple Past: <span class="verb-simple-past"></span></p>
      <p>Past Participle: <span class="verb-past-participle"></span></p>
      <p>Gerund: <span class="verb-gerund"></span></p>
      <p>Meaning: <span class="verb-meaning"></span></p>
    </div>
  </template>
  <script src="./script.js"></script>
</body>

</html>
